<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans p-4 md:p-8 flex justify-center items-center">

    <div class="w-full max-w-xl space-y-6">

        <!-- SEARCH BAR, SAVE & INSTALL BUTTONS -->
        <form id="search-form" class="flex justify-between items-center gap-2 md:gap-3 flex-wrap sm:flex-nowrap">
            <div class="relative flex-1 min-w-[180px]">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"></i>
                <input type="text" id="city-input" placeholder="Search city..." 
                    class="w-full bg-slate-800 text-slate-100 placeholder-slate-400 pl-10 pr-4 py-2.5 rounded-xl border border-slate-700/60 focus:outline-none focus:border-sky-500 transition-colors">
            </div>
            
            <div class="flex items-center gap-2">
                <button type="submit" class="bg-sky-600 px-4 py-2.5 rounded-xl hover:bg-sky-500 font-medium text-white transition-colors">
                    Search
                </button>
                
                <!-- Save City Button -->
                <button type="button" id="save-city-btn" title="Save current city" class="bg-slate-800 border border-slate-700/60 text-amber-400 p-2.5 rounded-xl hover:bg-slate-700 transition-colors flex items-center justify-center">
                    <i data-lucide="star" class="w-5 h-5"></i>
                </button>

                <!-- PWA Install Button (Hidden by default, shown only on web browser if installable) -->
                <button type="button" id="pwa-install-btn" title="Install App" style="display: none;" class="bg-emerald-600 border border-emerald-500/60 text-white px-3 py-2.5 rounded-xl hover:bg-emerald-500 font-medium transition-colors items-center gap-1.5 shadow-md">
                    <i data-lucide="download" class="w-4 h-4"></i>
                    <span class="text-sm">Install</span>
                </button>
            </div>
        </form>

        <!-- SAVED CITIES TABS BAR -->
        <div class="space-y-2">
            <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-1">
                <i data-lucide="bookmark" class="w-3.5 h-3.5 text-sky-400"></i> Saved Cities
            </div>
            <div id="city-tabs" class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none"></div>
        </div>

        <!-- MAIN HERO CARD -->
        <main class="bg-slate-800/80 backdrop-blur-md rounded-3xl p-8 border border-slate-700/50 shadow-xl text-center space-y-4">
            <div class="flex justify-center text-sky-400">
                <img id="ui-icon" src="https://openweathermap.org/img/wn/02d@2x.png" alt="Weather Icon" class="w-24 h-24 drop-shadow-md">
            </div>

            <div>
                <h1 id="ui-temp" class="text-6xl font-bold tracking-tight text-white">--°C</h1>
                <p id="ui-condition" class="text-xl font-medium text-slate-300 mt-1 capitalize">Detecting location...</p>
            </div>

            <div class="flex justify-center items-center gap-4 text-sm text-slate-400 pt-2">
                <span class="flex items-center gap-1">
                    <i data-lucide="map-pin" class="w-4 h-4 text-sky-400"></i>
                    <span id="ui-location">--</span>
                </span>
                <span>•</span>
                <span id="ui-feels-like">Feels like: --°C</span>
            </div>
        </main>

        <!-- METRICS GRID -->
        <section class="grid grid-cols-2 gap-4">
            <div class="bg-slate-800/60 border border-slate-700/50 p-4 rounded-2xl space-y-3">
                <div class="flex items-center gap-2 text-slate-400 text-xs font-semibold uppercase">
                    <i data-lucide="droplets" class="w-4 h-4 text-sky-400"></i> Humidity
                </div>
                <div>
                    <p class="text-2xl font-bold text-slate-100"><span id="ui-humidity">--</span>%</p>
                </div>
            </div>

            <div class="bg-slate-800/60 border border-slate-700/50 p-4 rounded-2xl space-y-3">
                <div class="flex items-center gap-2 text-slate-400 text-xs font-semibold uppercase">
                    <i data-lucide="info" class="w-4 h-4 text-sky-400"></i> Status
                </div>
                <div>
                    <p id="ui-status" class="text-lg font-bold text-slate-100">Ready</p>
                </div>
            </div>
        </section>

    </div>

    <script>
        lucide.createIcons();

        let currentCityName = "";
        let savedCities = JSON.parse(localStorage.getItem("saved_weather_cities")) || ["London", "New York", "Tokyo"];

        // -------------------------------------------------------------
        // PWA INSTALL LOGIC
        // -------------------------------------------------------------
        let deferredPrompt = null;
        const installBtn = document.getElementById('pwa-install-btn');

        // Check if page is opened inside the installed standalone app
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

        if (!isStandalone) {
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                if (installBtn) installBtn.style.display = 'flex';
            });

            if (installBtn) {
                installBtn.addEventListener('click', async () => {
                    if (deferredPrompt) {
                        deferredPrompt.prompt();
                        const { outcome } = await deferredPrompt.userChoice;
                        if (outcome === 'accepted') {
                            installBtn.style.display = 'none';
                        }
                        deferredPrompt = null;
                    }
                });
            }

            window.addEventListener('appinstalled', () => {
                if (installBtn) installBtn.style.display = 'none';
                deferredPrompt = null;
            });
        } else {
            if (installBtn) installBtn.style.display = 'none';
        }

        // -------------------------------------------------------------
        // WEATHER APP API LOGIC
        // -------------------------------------------------------------
        function updateUI(data) {
            currentCityName = data.city;
            document.getElementById('ui-temp').textContent = `${data.temp}°C`;
            document.getElementById('ui-condition').textContent = data.description;
            document.getElementById('ui-location').textContent = data.city;
            document.getElementById('ui-feels-like').textContent = `Feels like: ${data.feels_like}°C`;
            document.getElementById('ui-humidity').textContent = data.humidity;
            document.getElementById('ui-status').textContent = "Active";

            if (data.icon_url) {
                document.getElementById('ui-icon').src = data.icon_url;
            }

            renderCityTabs();
        }

        async function fetchWeather(city) {
            try {
                const response = await fetch(`/api/weather?city=${encodeURIComponent(city)}`);
                if (!response.ok) throw new Error("City not found");
                const data = await response.json();
                updateUI(data);
            } catch (err) {
                alert("Could not find weather data for that city!");
            }
        }

        async function fetchWeatherByCoords(lat, lon) {
            try {
                const response = await fetch(`/api/weather?lat=${lat}&lon=${lon}`);
                if (!response.ok) throw new Error("Location weather not found");
                const data = await response.json();
                updateUI(data);
            } catch (err) {
                fetchWeather(savedCities[0] || "London");
            }
        }

        function renderCityTabs() {
            const container = document.getElementById("city-tabs");
            container.innerHTML = "";

            savedCities.forEach(city => {
                const isActive = city.toLowerCase() === currentCityName.toLowerCase();
                const tab = document.createElement("div");
                tab.className = `flex items-center gap-1.5 px-3 py-1.5 rounded-xl border text-sm font-medium cursor-pointer transition-all whitespace-nowrap ${
                    isActive ? 'bg-sky-600 border-sky-500 text-white shadow-md' : 'bg-slate-800/80 border-slate-700/60 text-slate-300 hover:bg-slate-700'
                }`;

                tab.innerHTML = `
                    <span onclick="fetchWeather('${city}')">${city}</span>
                    <button onclick="removeCity('${city}', event)" class="hover:text-red-400 text-slate-400 text-xs ml-1">✕</button>
                `;
                container.appendChild(tab);
            });
        }

        document.getElementById("save-city-btn").addEventListener("click", () => {
            if (!currentCityName) return;
            const exists = savedCities.some(c => c.toLowerCase() === currentCityName.toLowerCase());
            if (!exists) {
                savedCities.push(currentCityName);
                localStorage.setItem("saved_weather_cities", JSON.stringify(savedCities));
                renderCityTabs();
            }
        });

        function removeCity(cityToRemove, event) {
            event.stopPropagation();
            savedCities = savedCities.filter(c => c.toLowerCase() !== cityToRemove.toLowerCase());
            localStorage.setItem("saved_weather_cities", JSON.stringify(savedCities));
            renderCityTabs();
        }

        function getUserLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => fetchWeatherByCoords(pos.coords.latitude, pos.coords.longitude),
                    () => fetchWeather(savedCities[0] || "London")
                );
            } else {
                fetchWeather(savedCities[0] || "London");
            }
        }

        document.getElementById('search-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const city = document.getElementById('city-input').value.trim();
            if (city) fetchWeather(city);
        });

        // App Init
        getUserLocation();

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch((err) => console.log('SW Registration Failed', err));
        }
    </script>
</body>
</html>
